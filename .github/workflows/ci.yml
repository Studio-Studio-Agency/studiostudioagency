name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Das Wurzelprojekt (Vite/React) und die Vaulteer-Website (Astro) sind
  # getrennte npm-Projekte mit eigenen Lockfiles. Sie laufen deshalb als eigene
  # Jobs: ein Fehler im einen darf den anderen nicht verdecken.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests
        run: npm run test

      # Full-repo lint has pre-existing errors on main; gate only the
      # Klimapartner chatbot code until the legacy findings are cleaned up.
      - name: Lint (klima chatbot)
        run: >
          npx eslint
          src/lib/klima/
          src/components/klima/
          src/pages/KlimapartnerPage.tsx
          src/pages/KlimaLeadsPage.tsx
          src/klima-main.tsx
          vite.klimapartner.config.ts
          supabase/functions/klima-chat/
          supabase/functions/klima-knowledge/
          supabase/functions/klima-admin/
          supabase/functions/_shared/klima/

      - name: Build
        run: npm run build

      - name: Build (Klimapartner standalone)
        run: npm run build:klimapartner

  vaulteer:
    name: vaulteer (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaulteer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vaulteer/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      # Baut die Live-Konfiguration: eigene Domain, Basispfad /, indexierbar.
      # Der Vorschau-Build unterscheidet sich nur in diesen drei Variablen,
      # deckt aber den Indexierungs- und Sitemap-Pfad nicht ab.
      - name: Build (live)
        run: npm run build:live

      # Die Seite darf keine Verbindung zu einer Drittdomain aufbauen. Das ist
      # eine Produktanforderung des Auftraggebers, keine Praeferenz — deshalb
      # gehoert sie in die Pipeline und nicht in eine einmalige Pruefung.
      - name: Keine Drittdomains im Build
        run: |
          set -euo pipefail

          # Ohne diese Zaehlung besteht der Schritt auch dann, wenn dist/ gar
          # nicht existiert: grep findet nichts, und "nichts gefunden" liest
          # sich wie "sauber". Erst die Untergrenze macht die Pruefung echt.
          pages=$(find dist -name '*.html' | wc -l)
          if [ "$pages" -lt 20 ]; then
            echo "::error::Nur $pages HTML-Seiten in dist/ — der Build ist unvollstaendig."
            exit 1
          fi
          echo "$pages Seiten gebaut."

          # Gesucht wird, was einen Abruf ausloest: Attribute, url() und
          # @import. Eine Domain im Fliesstext oder in einem Lizenz-Kommentar
          # baut keine Verbindung auf — Tailwind schreibt seinen MIT-Hinweis
          # samt Adresse ins CSS. Wer danach ebenfalls alarmiert, hat nach
          # der dritten Fehlmeldung eine Pruefung, die niemand mehr liest.
          fremd=$(grep -rEoh \
                    -e '(href|src|srcset|action|poster|data-src)="https?://[^"]+' \
                    -e 'url\(\s*["'"'"']?https?://[^)"'"'"']+' \
                    -e '@import[^;]*https?://[^;"'"'"']+' \
                    dist --include='*.html' --include='*.css' --include='*.js' \
                  | grep -oE 'https?://[a-zA-Z0-9.-]+' \
                  | sort -u \
                  | grep -vE '^https?://(vaulteer\.ch|www\.w3\.org)$' \
                  || true)
          if [ -n "$fremd" ]; then
            echo "::error::Ein Element im Build ruft eine fremde Domain ab:"
            echo "$fremd"
            exit 1
          fi
          echo "Keine abrufenden Verweise auf fremde Domains."
