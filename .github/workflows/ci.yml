name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Tests
        run: npm run test

      # Full-repo lint has pre-existing errors on main; gate only the
      # Klimapartner chatbot code until the legacy findings are cleaned up.
      - name: Lint (klima chatbot)
        run: >
          npx eslint
          src/lib/klima/
          src/components/klima/
          src/pages/KlimapartnerPage.tsx
          supabase/functions/klima-chat/
          supabase/functions/klima-knowledge/
          supabase/functions/_shared/klima/

      - name: Build
        run: npm run build
